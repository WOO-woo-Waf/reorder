[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reorder-engine"
version = "0.1.0"
description = "星绫解封（Hoshiribbon / ReOrder Engine）：本地资源恢复、解压与整理"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pyzipper>=0.3.6",
]

[project.optional-dependencies]
desktop = ["pydantic>=2.10,<3", "keyring>=25,<26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
